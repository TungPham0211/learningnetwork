name: net01

topology:
  defaults:
    kind: linux
    image: nicolaka/netshoot:v0.14
    cmd: sleep infinity
    network-mode: none
    cap-add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"

  nodes:
    h1:
      exec:
        - ip link set dev eth1 address 02:00:00:00:01:01
        - ip address replace 192.168.10.11/24 dev eth1
        - ip link set dev eth1 up

    sw1:
      exec:
        - ip link add name br0 type bridge stp_state 0
        - ip link set dev eth1 master br0
        - ip link set dev eth2 master br0
        - ip link set dev eth1 up
        - ip link set dev eth2 up
        - ip link set dev br0 up

    h2:
      exec:
        - ip link set dev eth1 address 02:00:00:00:02:02
        - ip address replace 192.168.10.12/24 dev eth1
        - ip link set dev eth1 up

  links:
    - endpoints: ["h1:eth1", "sw1:eth1"]
    - endpoints: ["h2:eth1", "sw1:eth2"]

